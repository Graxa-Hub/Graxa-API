spring.application.name=Graxa-API

# Configuração do Banco de Dados (H2 persistente em arquivo)
spring.datasource.url=jdbc:h2:file:./data/graxaDB;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.defer-datasource-initialization=true
# Forçar execução do data.sql mesmo em banco persistente
spring.sql.init.mode=never


# Configuração do H2 Console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.path=/h2-console
spring.h2.console.enabled=true

# Mostrar SQL no console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-stacktrace=never

# Configuração JWT
jwt.validity=3600000
jwt.

# Configuração Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuração Upload de Imagem
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuração de Envio de Emails
