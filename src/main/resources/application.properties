spring.application.name=Graxa-API

# DB H2 (apenas para dev)
spring.datasource.url=jdbc:h2:file:./data/graxaDB;AUTO_SERVER=TRUE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.validity=360000
jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Upload
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=macarimarcelino@gmail.com
spring.mail.password=wyai ulxs bask fxir
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

resilience4j.ratelimiter.instances.login.limitForPeriod=5
resilience4j.ratelimiter.instances.login.limitRefreshPeriod=15s
resilience4j.ratelimiter.instances.login.timeoutDuration=0

resilience4j.ratelimiter.instances.recuperacao.limitForPeriod=3
resilience4j.ratelimiter.instances.recuperacao.limitRefreshPeriod=1h
resilience4j.ratelimiter.instances.recuperacao.timeoutDuration=0

resilience4j.ratelimiter.instances.validacao.limitForPeriod=5
resilience4j.ratelimiter.instances.validacao.limitRefreshPeriod=5m
resilience4j.ratelimiter.instances.validacao.timeoutDuration=0

# RabbitMQ (envio assíncrono de e-mail de alocação)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

graxa.rabbit.email-alocacao.queue=${RABBITMQ_EMAIL_ALOCACAO_QUEUE:graxa.email.alocacao.queue}
graxa.rabbit.email-alocacao.exchange=${RABBITMQ_EMAIL_ALOCACAO_EXCHANGE:graxa.email.alocacao.exchange}
graxa.rabbit.email-alocacao.routing-key=${RABBITMQ_EMAIL_ALOCACAO_ROUTING_KEY:graxa.email.alocacao.routing-key}
